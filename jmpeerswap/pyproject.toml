[project]
name = "jmpeerswap"
version = "0.1.0"
description = "Standalone Core Lightning PeerSwap bridge plugin for JoinMarket-NG"
requires-python = ">=3.11,<4.0"
dependencies = [
    "pyln-client>=26.6.8,<27.0.0",
]

[project.scripts]
jm-peerswap = "jmpeerswap.plugin:main"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
