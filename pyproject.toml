[project]
name = "jmlightning-meta"
version = "0.1.0"
description = "Meta-package for JoinMarket-NG bridge module and plugin for Lightning Network nodes (Core Lightning)"
requires-python = ">=3.11"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
pythonpath = ["jmlightning/src", "jmpeerswap/src"]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
mypy_path = ["jmlightning/src", "jmpeerswap/src"]
explicit_package_bases = true
exclude = '(^|/)build/'

[[tool.mypy.overrides]]
module = "pyln.client.*"
ignore_missing_imports = true

[tool.ruff]
src = ["jmlightning/src", "jmpeerswap/src"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
