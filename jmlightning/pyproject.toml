[project]
name = "jmlightning"
version = "0.1.0"
description = "JoinMarket-NG bridge module for Lightning Network nodes (Core Lightning)"
requires-python = ">=3.11,<4.0"
dependencies = [
    "jmcore>=0.39.2,<0.40.0",
    "jmwallet>=0.39.2,<0.40.0",
    "pyln-client>=26.6.8,<27.0.0",
]

[project.scripts]
jm-lightning = "jmlightning.cli:main"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
