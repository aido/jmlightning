name: Static Analysis

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.11"
  JMNG_VERSION: "0.37.0"

jobs:
  quality:
    name: Linting, Formatting & Type Checking
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            "git+https://github.com/joinmarket-ng/joinmarket-ng.git@${JMNG_VERSION}#subdirectory=jmcore" \
            "git+https://github.com/joinmarket-ng/joinmarket-ng.git@${JMNG_VERSION}#subdirectory=jmwallet"
          python -m pip install .
          python -m pip install pytest ruff mypy[reports]

      - name: Linting
        run: |
          ruff check --output-format junit --output-file ruff-junit.xml .

      - name: Formatting
        run: |
          ruff format --check .

      - name: Type Checking
        run: |
          mypy --junit-xml mypy-junit.xml --html-report mypy-html .

      - name: Upload results to GitHub
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: static-analysis-${{ github.sha }}
          path: |
            ruff-junit.xml
            mypy-junit.xml
            mypy-html/
          if-no-files-found: error

      - name: Upload results to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@v6
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          name: static-analysis
          flags: static
          report_type: test_results
