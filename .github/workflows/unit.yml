name: Unit tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit:
    name: Unit tests & Coverage (${{ matrix.python-version }} / JoinMarket-NG ${{ matrix.jmng-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
          fail-fast: false
          matrix:
            python-version: ["3.11", "3.12", "3.13"]
            jmng-version: ["0.40.0", "0.41.0"]

    steps:
      - name: Checkout jmlightning
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git \
            python3-dev \
            python3-pip \
            python3-venv \
            libffi-dev \
            libsecp256k1-dev

      - name: Install JoinMarket-NG
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            "git+https://github.com/joinmarket-ng/joinmarket-ng.git@${{ matrix.jmng-version }}#subdirectory=jmcore" \
            "git+https://github.com/joinmarket-ng/joinmarket-ng.git@${{ matrix.jmng-version }}#subdirectory=jmwallet"
          python -m pip install ./jmlightning
          python -m pip install ./jmpeerswap
          python -m pip install pytest pytest-cov

      - name: Unit tests
        run: |
          pytest tests/unit/ \
            --cov-branch \
            --cov=jmlightning \
            --cov-report=term-missing \
            --cov-report=xml \
            --cov-report=html \
            --junitxml=junit.xml \
            -o junit_family=legacy

      - name: Upload coverage to GitHub
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: coverage-${{ github.sha }}
          path: |
            coverage.xml
            junit.xml
            htmlcov/
          if-no-files-found: error

      - name: Upload coverage to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@v6
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          name: unit-tests
          flags: unit
          report_type: coverage

      - name: Upload test results to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@v6
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          name: unit-tests
          flags: unit
          report_type: test_results
